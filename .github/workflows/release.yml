name: Draft set release

on:
  push:
    tags:
      - "**/v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the pinned reference validator
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate sources
        run: python tools/check_repo.py --require-reference-validator
      - name: Build release archive and verify evidence
        run: |
          set -euo pipefail
          set_name="${GITHUB_REF_NAME%/v*}"
          python tools/build_set.py "$set_name" --for-release --tag "$GITHUB_REF_NAME" --output dist
      - name: Create a GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set_name="${GITHUB_REF_NAME%/v*}"
          version="${GITHUB_REF_NAME##*/v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/${set_name}-${version}.zip" \
            dist/evaluation-report.json \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
