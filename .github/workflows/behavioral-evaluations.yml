name: Behavioral Evaluations

on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (manual runs also support fork PRs)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      has_affected: ${{ steps.affected.outputs.has_affected || 'false' }}
      sets_json: ${{ steps.affected.outputs.sets_json || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and verify pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          expected_head=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            metadata="$(python3 -c 'import json,os; e=json.load(open(os.environ["GITHUB_EVENT_PATH"])); p=e["workflow_run"].get("pull_requests", []); print((str(p[0]["number"])+" "+p[0]["head"]["sha"]) if p else "")')"
            read -r pr_number expected_head <<< "$metadata"
          else
            pr_number="$PR_INPUT"
          fi
          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '{state,head:{sha:.head.sha,repo:{full_name:.head.repo.full_name}},base:{sha:.base.sha,repo:{full_name:.base.repo.full_name}}}')"
          PR_JSON="$pr_json" EXPECTED_HEAD="$expected_head" python3 - "$pr_number" "$GITHUB_REPOSITORY" "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          import os
          number, repository, output = sys.argv[1:]
          pr = json.loads(os.environ["PR_JSON"])
          if pr.get("state") != "open" or pr["base"]["repo"]["full_name"].lower() != repository.lower():
              raise SystemExit("Pull request must be open and target this repository.")
          for field in ("head", "base"):
              if not re.fullmatch(r"[0-9a-fA-F]{40,64}", pr[field]["sha"]):
                  raise SystemExit("GitHub returned an invalid pull request commit.")
          with open(output, "a", encoding="utf-8") as f:
              f.write(f"number={number}\nhead_sha={pr['head']['sha']}\nbase_sha={pr['base']['sha']}\n")
              if os.environ["EXPECTED_HEAD"] and os.environ["EXPECTED_HEAD"] != pr["head"]["sha"]:
                  f.write("stale=true\n")
                  raise SystemExit(0)
              f.write("stale=false\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.stale != 'true'
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Identify affected skill sets
        id: affected
        if: steps.pr.outputs.stale != 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 tools/run_evaluations.py --source-root candidate --changed-from "$BASE_SHA" --list-affected > "$RUNNER_TEMP/affected.json"
          python3 - "$RUNNER_TEMP/affected.json" "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          affected = json.load(open(sys.argv[1], encoding="utf-8"))
          if not all(re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", name) for name in affected):
              raise SystemExit("Invalid affected-set identifier.")
          with open(sys.argv[2], "a", encoding="utf-8") as f:
              f.write(f"has_affected={'true' if affected else 'false'}\n")
              f.write("sets_json=" + json.dumps(sorted(affected), separators=(",", ":")) + "\n")
          PY

  evaluate:
    needs: prepare
    if: needs.prepare.outputs.has_affected == 'true'
    runs-on: ubuntu-latest
    environment:
      name: skill-evaluations
    concurrency:
      group: skill-evaluations-${{ needs.prepare.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ needs.prepare.outputs.pr_number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install trusted validator and OpenCode runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm install --global @opencode/cli@2.2.5
      - name: Evaluate affected skills
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          SETS_JSON: ${{ needs.prepare.outputs.sets_json }}
          MODEL: opencode/gpt-6-luna
          RESULT_FILE: ${{ runner.temp }}/behavioral-evaluation.json
        run: |
          set -euo pipefail
          mapfile -t sets < <(python3 -c 'import json,os; print("\n".join(json.loads(os.environ["SETS_JSON"])))')
          args=()
          for set_name in "${sets[@]}"; do args+=(--set "$set_name"); done
          set +e
          python tools/run_evaluations.py --ci --source-root candidate --changed-from "$BASE_SHA" --model "$MODEL" --output "$RESULT_FILE" "${args[@]}"
          eval_status=$?
          set -e
          python3 - "$RESULT_FILE" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("## Behavioral evaluation\n\n")
              summary.write(f"**Status:** {result['status']}\n\n")
              if result.get("runtime"):
                  summary.write(f"Runtime: {result['runtime']} {result['runtime_version']} · Model: `{result['model']}`\n\n")
                  summary.write("| Set | Skill | Case | Critical | Result | Activation errors | Runtime errors | Rubric failures |\n")
                  summary.write("|---|---|---|---:|---|---:|---:|---:|\n")
                  for item in result["evaluations"]:
                      summary.write(f"| {item['set']} | {item['skill']} | {item['case']} | {item['critical']} | {item['status']} | {item['activation_errors']} | {item['runtime_errors']} | {item['rubric_failures']} |\n")
              else:
                  summary.write("No affected skills required behavioral evaluation.\n")
          PY
          exit "$eval_status"
