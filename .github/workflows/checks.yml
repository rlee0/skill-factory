name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the pinned reference validator
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate sets, cases, and skills
        run: python tools/check_repo.py --require-reference-validator
      - name: Test release gates
        run: python -m unittest discover -s tests
